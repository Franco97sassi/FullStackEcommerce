apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce
  namespace: ecommerce
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: nginx
  tls:
    - hosts: [tienda.example.com, api.tienda.example.com]
      secretName: ecommerce-tls
  rules:
    - host: tienda.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: frontend, port: {name: http}}
    - host: api.tienda.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: backend, port: {name: http}}
