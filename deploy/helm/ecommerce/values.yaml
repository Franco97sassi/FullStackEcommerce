nameOverride: ""
fullnameOverride: ""

backend:
  replicas: 2
  image:
    repository: registry/ecommerce-backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  config:
    aspnetcoreEnvironment: Production
    jwtIssuer: Ecommerce.API
    jwtAudience: Ecommerce.Web
    kafkaEnabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 750m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75
  pdb:
    enabled: true
    minAvailable: 1
  probes:
    startup:
      failureThreshold: 30
      periodSeconds: 5
    readiness:
      periodSeconds: 10
      timeoutSeconds: 3
    liveness:
      periodSeconds: 15
      timeoutSeconds: 3

frontend:
  replicas: 2
  image:
    repository: registry/ecommerce-frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  config:
    nodeEnv: production
    apiUrl: https://api.tienda.example.com
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 384Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1

redis:
  endpoint: redis:6379
kafka:
  bootstrapServers: kafka:9092
  orderCreatedTopic: ecommerce.orders.created.v1
elasticsearch:
  endpoint: http://elasticsearch:9200
opentelemetry:
  endpoint: http://otel-collector:4317

imagePullSecrets: []
serviceAccount:
  create: true
  annotations: {}
  automount: false

secrets:
  # Leave create=false in shared environments and supply an ExternalSecret or
  # SealedSecret with these keys instead.
  create: false
  existingSecret: ecommerce-secrets
  annotations: {}
  values:
    connectionString: ""
    jwtKey: ""

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
  frontendHost: tienda.example.com
  backendHost: api.tienda.example.com
  tls:
    enabled: true
    secretName: ecommerce-tls

networkPolicy:
  enabled: true
  ingressNamespaceLabels:
    kubernetes.io/metadata.name: ingress-nginx
  monitoringNamespaceLabels:
    kubernetes.io/metadata.name: monitoring
  monitoringPodLabels:
    app.kubernetes.io/name: prometheus

serviceMonitor:
  enabled: true
  interval: 30s
  additionalLabels: {}
