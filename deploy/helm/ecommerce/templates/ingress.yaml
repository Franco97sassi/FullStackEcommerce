{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ecommerce.fullname" . }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ required "ingress.frontendHost is required" .Values.ingress.frontendHost | quote }}
        - {{ required "ingress.backendHost is required" .Values.ingress.backendHost | quote }}
      secretName: {{ required "ingress.tls.secretName is required when TLS is enabled" .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ required "ingress.frontendHost is required" .Values.ingress.frontendHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ecommerce.componentName" (dict "root" . "component" "frontend") }}
                port:
                  name: http
    - host: {{ required "ingress.backendHost is required" .Values.ingress.backendHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ecommerce.componentName" (dict "root" . "component" "backend") }}
                port:
                  name: http
{{- end }}
