{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ecommerce.fullname" . }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
  {{- with .Values.secrets.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: {{ required "secrets.values.connectionString is required when secrets.create=true" .Values.secrets.values.connectionString | quote }}
  Jwt__Key: {{ required "secrets.values.jwtKey is required when secrets.create=true" .Values.secrets.values.jwtKey | quote }}
{{- end }}
